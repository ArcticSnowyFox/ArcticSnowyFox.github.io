<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Wecome to the internet, have a look around</title>
</head>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-weight: 250;
        font-size: 1.2rem;
        font-style: normal;
        text-decoration: none;
    }

    body {
        background-color: #000;
        color: #fff;
        font-family: inter;
        text-align: center;

        display: flex;
        flex-flow: column nowrap;
        justify-content: start;
        align-items: center;
    }

    #main-title {
        font-size: 6rem;
        margin-top: 1rem;
    }

    .card-container {
        width: fit-content;
        height: fit-content;
        margin-top: 2rem;
        padding: 1rem;

        display: flex;
        flex-flow: row wrap;
        justify-content: center;
        align-items: start;
        gap: 1rem 1rem;

        border-radius: 1.5rem;
        border: 1.5px solid #fff;
    }

    .card {
        width: 20rem;
        height: 10rem;
        padding: 0.5rem;

        display: flex;
        flex-flow: column nowrap;
        justify-content: center;
        align-items: center;

        border-radius: 1rem;
        border: 1.5px solid #fff;
    }

    .link {
        font-size: 3rem;
        text-decoration: underline;
        color: #fff;
        padding-bottom: 0.5rem;
    }

    @media screen and (max-width: 850px) {
        #main-title {
            font-size: 20vw;
        }

        .card-container {
            flex-flow: column nowrap;
        }

        .card {
            width: 80vw;
            height: 7.5rem;
            padding: 12vw;
        }

        .link {
            font-size: 12vw;
            padding-bottom: 2vw;
        }
    }
</style>

<body>
    <p id="main-title">Welcome</p>
    <div class="card-container">
        <a href="resources/start.html">
            <div class="card">
                <p class="link">Recources</p>
            </div>
        </a>
        <a href="old_bs/index.html">
            <div class="card">
                <p class="link">Old BS</p>
            </div>
        </a>
    </div>
</body>

</html>
